<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>의학과 2학년 시간표</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#f0eee8">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="시간표">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="page">
  <header class="topbar">
    <div class="titlewrap">
      <div class="title"><span id="titleMain">의학과 시간표</span><small id="weekRange"></small></div>
      <div class="meta"><button id="btnMenu" class="hlbtn" type="button" aria-label="메뉴" title="메뉴" aria-haspopup="true"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18"/></svg><span id="btnMenuDot" class="dot" hidden></span></button><span id="verBadge" class="badge" hidden></span><span id="srcBadge" class="badge"></span><span id="updated"></span></div>
    </div>
    <nav class="weeknav">
      <button id="btnPrev" class="nbtn" aria-label="이전">◀</button>
      <button id="tabDay" class="nbtn tab">오늘</button>
      <button id="tabWeek" class="nbtn tab">주간</button>
      <button id="tabTwo" class="nbtn tab">2주간</button>
      <button id="tabMonth" class="nbtn tab">월간</button>
      <button id="btnNext" class="nbtn" aria-label="다음">▶</button>
    </nav>
  </header>

  <div id="grid" class="gridc" aria-live="polite"></div>

  <div id="notice" class="notice" hidden></div>
</div>

<div id="ntcBanner" class="ntcmodal" role="dialog" aria-modal="true" aria-labelledby="ntcBannerDate" hidden>
  <div class="ntcmodal-card">
    <button id="ntcBannerX" class="ntcmodal-x" type="button" aria-label="닫기">✕</button>
    <div class="ntcmodal-tag">새 공지</div>
    <div id="ntcBannerDate" class="ntcmodal-date"></div>
    <div id="ntcBannerBody" class="ntcmodal-body"></div>
    <button id="ntcBannerOk" class="nbtn ntcmodal-ok" type="button">확인</button>
  </div>
</div>
<div id="sheetpop" class="sheetpop" hidden>
  <div class="sheetpop-inner">
    <div id="popBody"></div>
    <button id="popClose" class="nbtn">닫기</button>
  </div>
</div>
<div id="menupop" class="sheetpop" hidden>
  <div class="sheetpop-inner">
    <div class="hltitle">메뉴</div>
    <ul class="menulist">
      <li><button id="miHl" class="menuitem" type="button"><span class="mi-ico">🎨</span>개인 하이라이트 설정</button></li>
      <li><button id="miNtc" class="menuitem" type="button"><span class="mi-ico">📢</span>공지사항<span id="ntcDot" class="dot" hidden></span></button></li>
      <li><a id="miGuide" class="menuitem" href="guide.html"><span class="mi-ico">📖</span>설치 가이드 및 사용법</a></li>
    </ul>
    <button id="menuClose" class="nbtn hlclose" type="button">닫기</button>
  </div>
</div>
<div id="hlpop" class="sheetpop" hidden>
  <div class="sheetpop-inner">
    <div class="hltitle">개인 하이라이트</div>
    <div class="hldesc">강조할 <b>이름</b>을 넣고 <b>학생/교수</b>를 고른 뒤, 색 동그라미를 눌러 <b>원하는 색</b>을 고르면 그 이름이 든 줄 전체가 <b>이 기기에서만</b> 그 색으로 보여요. <b>학생</b>은 초안자·검안자 줄에서, <b>교수</b>는 (이름, 과) 줄에서 찾아요.<br><b>＋ 추가</b>로 여러 명을 서로 다른 색으로 강조할 수 있고, <b>−</b>로 지워요.</div>
    <div id="hlRows"></div>
    <button id="hlAdd" class="nbtn hladd" type="button">＋ 추가</button>
    <button id="hlSave" class="nbtn" type="button">저장</button>
    <button id="hlClose" class="nbtn hlclose" type="button">닫기</button>
  </div>
</div>
<div id="ntcpop" class="sheetpop" hidden>
  <div class="sheetpop-inner">
    <div class="hltitle">공지사항</div>
    <div id="ntcBody" class="ntclist"></div>
    <button id="ntcClose" class="nbtn hlclose" type="button">닫기</button>
  </div>
</div>

<script src="notices.js"></script>
<script src="app.js"></script>
<!-- 익명 방문 집계(GoatCounter) — 쿠키·개인정보 없음, 배포 도메인에서만 로드 -->
<script>
if (location.hostname === 'pureart-art.github.io') {
  var gc = document.createElement('script');
  gc.async = true;
  gc.src = 'https://gc.zgo.at/count.js';
  gc.setAttribute('data-goatcounter', 'https://timetable26.goatcounter.com/count');
  document.head.appendChild(gc);
}
</script>
</body>
</html>
