<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>여백 튜너</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#f0eee8">
<link rel="manifest" href="diag-manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="여백튜너">
<style>
  *{box-sizing:border-box}
  /* 실제 앱과 같은 글꼴·색·크기라야 여기서 읽은 값을 그대로 옮길 수 있다 */
  body{margin:0;padding:var(--p,40px) 8px 10px;background:#f0eee8;color:#1f1e1c;
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    -webkit-font-smoothing:antialiased}
  .title{font-size:18px;font-weight:500}
  .title small{font-weight:400;color:#5f5e5a;margin-left:8px}
  .meta{font-size:11px;color:#8a897f;margin-top:3px}
  .badge{display:inline-block;border:.5px solid #b5b2aa;border-radius:4px;padding:0 5px;margin-right:6px;font-size:10px;color:#73726c}
  .now{margin:26px 0 10px;font-size:15px;font-weight:600}
  .now b{font-size:30px;font-variant-numeric:tabular-nums}
  .pads{display:flex;flex-wrap:wrap;gap:8px}
  .pads button{font:inherit;font-size:15px;font-weight:600;min-width:56px;padding:11px 0;
    background:#fff;border:.5px solid #b5b2aa;border-radius:8px;color:#3a3a37;
    -webkit-tap-highlight-color:transparent}
  .pads button[aria-pressed="true"]{background:#2E75B6;border-color:#2E75B6;color:#fff}
  .how{margin-top:20px;font-size:13.5px;line-height:1.6;color:#3a3a37;
    background:#fff;border:.5px solid #CFCCC4;border-radius:10px;padding:12px 14px}
  .how b{color:#1f1e1c}
</style>
</head>
<body>
<!-- 밴드에 실제로 걸리는 건 이 제목 한 줄. 앱의 헤더와 똑같이 생겼다. -->
<div class="title">의학과 26-2 시간표: 3주 <small>2026. 9. 14 – 9. 20</small></div>
<div class="meta"><span class="badge">v213</span>마지막 갱신 15시 41분 35초</div>

<div class="now">지금 위쪽 여백 <b id="cur">40</b>px</div>
<div class="pads" id="pads"></div>

<div class="how">
  위 숫자를 <b>큰 값부터 하나씩 내려가며</b> 누르고, 그때마다 맨 윗줄
  <b>“의학과 26-2 시간표: 3주”</b>가 또렷한지만 봐.<br><br>
  흐려지기 <b>직전</b> 값이 우리가 쓸 수 있는 가장 작은 여백이야. 그 숫자만 알려줘.
</div>

<script>
  var VALUES = [40, 36, 32, 28, 24, 20, 16, 12];
  var pads = document.getElementById('pads'), cur = document.getElementById('cur');
  function pick(v){
    document.documentElement.style.setProperty('--p', v + 'px');
    cur.textContent = v;
    [].forEach.call(pads.children, function(b){
      b.setAttribute('aria-pressed', String(+b.dataset.v === v));
    });
    try { localStorage.setItem('pad', v); } catch (e) {}
  }
  VALUES.forEach(function(v){
    var b = document.createElement('button');
    b.textContent = v; b.dataset.v = v;
    b.addEventListener('click', function(){ pick(v); });
    pads.appendChild(b);
  });
  var saved;
  try { saved = parseInt(localStorage.getItem('pad'), 10); } catch (e) {}
  pick(VALUES.indexOf(saved) >= 0 ? saved : 40);
</script>
</body>
</html>
