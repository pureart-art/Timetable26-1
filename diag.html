<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>상단 블러 밴드 측정</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#f0eee8">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="측정">
<style>
  *{box-sizing:border-box}
  body{margin:0;padding:0;background:#f0eee8;color:#1f1e1c;
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    -webkit-font-smoothing:antialiased}
  /* safe-area 를 CSS 로만 재어서 JS 가 읽는다 — 같은 사실을 두 곳에서 유도하지 않는다 */
  #sat{position:absolute;top:0;left:0;width:1px;height:env(safe-area-inset-top,0px);visibility:hidden}
  #sab{position:absolute;top:0;left:0;width:1px;height:env(safe-area-inset-bottom,0px);visibility:hidden}
  #sal{position:absolute;top:0;left:0;width:1px;height:env(safe-area-inset-left,0px);visibility:hidden}
  #sar{position:absolute;top:0;left:0;width:1px;height:env(safe-area-inset-right,0px);visibility:hidden}
  .row{height:20px;line-height:20px;font-size:13px;font-weight:500;padding-left:6px;white-space:nowrap}
  .row:nth-child(odd){background:#e6e3db}
  .ref{height:20px;background:#1f1e1c}
  h2{font-size:14px;margin:18px 6px 6px}
  table{border-collapse:collapse;font-size:13px;margin:0 6px}
  td{border:1px solid #b5b2aa;padding:3px 7px;font-variant-numeric:tabular-nums}
  td:first-child{color:#5f5e5a}
  .tall{height:1400px;background:linear-gradient(#f0eee8,#d8d4ca);padding:8px;font-size:13px}
</style>
</head>
<body>
<div id="sat"></div><div id="sab"></div><div id="sal"></div><div id="sar"></div>
<div id="ruler"></div>
<h2>측정값</h2>
<table id="out"></table>
<div class="tall">여기부터 길게 스크롤 — 위로 스크롤해 올린 글자가 상단에서 흐려지면 밴드는 <b>화면 고정</b>, 안 흐려지면 <b>문서 상단에만</b> 있는 것.</div>
<script>
  // 문서 최상단부터 20px 간격 눈금 — 어디까지 흐려지는지 스크린샷으로 읽는다
  var r = document.getElementById('ruler'), h = '';
  for (var y = 0; y < 260; y += 20) {
    h += '<div class="row">' + y + 'px 가나다 ABC 123 의학과</div>';
  }
  r.innerHTML = '<div class="ref"></div>' + h;

  function px(id){ return Math.round(document.getElementById(id).getBoundingClientRect().height * 100) / 100; }
  var vv = window.visualViewport || {};
  var rows = [
    ['safe-area-inset-top',    px('sat') + ' px'],
    ['safe-area-inset-bottom', px('sab') + ' px'],
    ['safe-area-inset-left',   px('sal') + ' px'],
    ['safe-area-inset-right',  px('sar') + ' px'],
    ['display-mode standalone', String(matchMedia('(display-mode: standalone)').matches)],
    ['display-mode fullscreen', String(matchMedia('(display-mode: fullscreen)').matches)],
    ['navigator.standalone',   String(navigator.standalone)],
    ['innerWidth x innerHeight', innerWidth + ' x ' + innerHeight],
    ['screen', screen.width + ' x ' + screen.height],
    ['devicePixelRatio',       String(devicePixelRatio)],
    ['visualViewport offsetTop', String(vv.offsetTop)],
    ['visualViewport height',  String(vv.height)],
    ['userAgent',              navigator.userAgent]
  ];
  document.getElementById('out').innerHTML = rows.map(function(p){
    return '<tr><td>' + p[0] + '</td><td>' + p[1] + '</td></tr>';
  }).join('');
</script>
</body>
</html>
